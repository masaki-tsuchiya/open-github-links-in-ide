<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
  </head>

  <body style="min-width: 500px">
    <h3>GitHub のリンクを IDE で開く</h3>

    <label>リポジトリを clone している親フォルダ:</label>
    <input type="text" id="localPathForRepositories" />
    <label>リンクを開く IDE:</label>
    <select id="defaultIde">
      <option value="vscode">Visual Studio Code</option>
      <option value="vscode-wsl">Visual Studio Code [WSL: Ubuntu]</option>
      <option value="vscodium">VSCodium</option>
      <option value="vscodium-wsl">VSCodium [WSL: Ubuntu]</option>
      <option value="vscode-insiders">Visual Studio Code Insiders</option>
      <option value="vscode-insiders-wsl">Visual Studio Code Insiders [WSL: Ubuntu]</option>
      <option value="phpstorm">PhpStorm</option>
      <option value="intellij-idea">IntelliJ IDEA</option>
      <option value="webstorm">WebStorm</option>
      <option value="goland">GoLand</option>
      <option value="clion">CLion</option>
      <option value="jetbrains-webserver">JetBrains 系 IDE（内蔵 Web サーバー経由）</option>
    </select>
    <label>アイコンを表示する場所:</label>
    <input type="checkbox" id="showIconInFileTree" /> ファイル一覧<br />
    <input type="checkbox" id="showIconOnFileBlockHeaders" /> ファイルの見出し<br />
    <input type="checkbox" id="showIconOnLineNumbers" /> 行番号<br />
    <label>デバッグ</label>
    <input type="checkbox" id="showDebugMessages" /> コンソールにデバッグ用のログを出す<br />
    <br />
    GitHub の再読み込みで反映されます
    <div style="float: right">
      バージョン <span id="version"></span> •
      <a target="_blank" href="https://github.com/masaki-tsuchiya/open-github-links-in-ide#changelog">変更履歴</a>
    </div>
  </body>
</html>
